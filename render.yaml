# Déploiement Render (static site).
#
# À utiliser soit via « New > Blueprint » (Render lit ce fichier), soit en
# réglant manuellement les mêmes valeurs dans le dashboard Render :
#
#   Build Command     : npm ci && npm run build -w frontend
#   Publish Path      : frontend/dist
#   Rewrite           : /*  →  /index.html  (200)   ← INDISPENSABLE (routes client)
#   Environment       : VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
#
# Le front est une SPA (vite-plugin-singlefile) : sans la règle de réécriture,
# toute URL profonde (/connexion, /inscription, /app…) renvoie un 404.
#
# Les variables VITE_* sont INLINÉES dans le bundle au moment du build :
# sans elles, src/lib/supabase.ts lève « Supabase n'est pas configuré » au
# chargement et la page reste blanche.

services:
  - type: web
    name: scolia
    runtime: static
    buildCommand: npm ci && npm run build -w frontend
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # En-têtes de sécurité (frame-ancestors ne fonctionne QUE via header HTTP,
    # jamais via <meta http-equiv> — voir audit F2).
    headers:
      - route: /*
        headers:
          - key: X-Content-Type-Options
            value: nosniff
          - key: X-Frame-Options
            value: DENY
          - key: Referrer-Policy
            value: strict-origin-when-cross-origin
          - key: Strict-Transport-Security
            value: max-age=15552000; includeSubDomains
          - key: Content-Security-Policy
            value: default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self';
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # API Express (backend/api) déployée séparément : sans elle, /admin et
      # les inscriptions échouent avec « API non configurée ».
      - key: VITE_API_URL
        sync: false
      # FRONTEND_ORIGIN : origine canonique du front (ex. https://classora-frontend.onrender.com).
      # Obligatoire en production (CORS fail-closed du backend). À définir dans Render.
      - key: FRONTEND_ORIGIN
        sync: false
