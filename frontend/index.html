<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!--
      CSP de défense en profondeur. Le bundle est inliné (vite-plugin-singlefile)
      d'où script-src 'self' 'unsafe-inline' — sans le single-file, restreindre
      à 'self'. Le CSP borne surtout les dégâts d'une dépendance compromise
      (script-src, connect-src, object-src 'none').
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.onrender.com http://localhost:* ws://localhost:*; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    />
    <title>Classora — Gestion scolaire pour les écoles privées au Sénégal</title>
    <meta
      name="description"
      content="Classora : la plateforme de gestion des écoles privées au Sénégal. Inscriptions, bulletins automatiques, suivi des paiements et messagerie parents-enseignants, du CI à la Terminale."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://classora-gsay.onrender.com/" />

    <!-- Open Graph / Twitter : aperçu de partage du site (la SPA affine
         og:url/og:title par page via usePageMeta). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Classora" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://classora-gsay.onrender.com/" />
    <meta property="og:title" content="Classora — Gestion scolaire pour les écoles privées au Sénégal" />
    <meta
      property="og:description"
      content="Inscriptions, bulletins automatiques, suivi des paiements et messagerie parents-enseignants : un seul outil pour diriger votre école privée, du CI à la Terminale."
    />
    <meta property="og:image" content="https://classora-gsay.onrender.com/images/hero.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Classora — Gestion scolaire pour les écoles privées au Sénégal" />
    <meta
      name="twitter:description"
      content="Inscriptions, bulletins automatiques, suivi des paiements et messagerie parents-enseignants : un seul outil pour diriger votre école privée."
    />
    <meta name="twitter:image" content="https://classora-gsay.onrender.com/images/hero.jpg" />

    <!-- Données structurées : informations factuelles uniquement (nom, URL,
         logo, contact déjà publiés sur le site). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://classora-gsay.onrender.com/#organization",
            "name": "Classora",
            "url": "https://classora-gsay.onrender.com/",
            "logo": "https://classora-gsay.onrender.com/images/logo-lime.png",
            "email": "contact@classora.sn",
            "areaServed": "SN"
          },
          {
            "@type": "WebSite",
            "@id": "https://classora-gsay.onrender.com/#website",
            "url": "https://classora-gsay.onrender.com/",
            "name": "Classora",
            "inLanguage": "fr-FR",
            "publisher": { "@id": "https://classora-gsay.onrender.com/#organization" }
          }
        ]
      }
    </script>

    <link rel="icon" type="image/png" sizes="64x64" href="/images/favicon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta name="color-scheme" content="light dark" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500..700&family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
