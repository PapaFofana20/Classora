name: CI

# Garde-fou de régression : les migrations Supabase doivent s'appliquer
# intégralement (`supabase db reset`) et le front doit compiler.
# Voir AUD-001 (les 10 migrations ne s'appliquaient pas).

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: TypeScript (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Audit front (parité + dates)
        run: node scripts/audit-parite.mjs

      - name: Audit signature du webhook de paiement
        run: node scripts/audit-webhook-signature.mjs

      - name: Migrations (Supabase)
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: supabase db reset (les 10 migrations doivent s'appliquer)
        run: |
          npx supabase start
          npx supabase db reset
